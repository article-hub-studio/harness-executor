<!doctype html>
<!-- upio MCP Executor — app shell (SA-web). Vanilla ES modules, no framework, no CDN. -->
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <meta name="description" content="upio MCP Executor — mobile control plane cho MCP servers, plugins, skills và agents.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>Harness Executor</title>
  <link rel="stylesheet" href="./css/app.css">
  <script>
    /* Áp theme sớm trước first-paint: light mặc định, dark qua class html.dark */
    try { if (localStorage.getItem('upio-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) { /* storage chặn */ }
    /* ERROR TRAP: lỗi module/JS hiện thẳng lên màn hình — hết đoán mù */
    window.__errs = [];
    function __showErr(m) {
      try {
        window.__errs.push(String(m).slice(0, 300));
        var box = document.getElementById('err-trap');
        if (!box) {
          box = document.createElement('div');
          box.id = 'err-trap';
          box.style.cssText = 'position:fixed;bottom:64px;left:8px;right:8px;z-index:99999;background:#0a0a0a;color:#ff6b6b;font:11.5px/1.5 ui-monospace,monospace;padding:10px;border-radius:10px;max-height:40vh;overflow:auto;white-space:pre-wrap';
          document.body && document.body.appendChild(box);
        }
        box.textContent = 'JS ERRORS:\n' + window.__errs.join('\n');
      } catch (e2) {}
    }
    window.addEventListener('error', function (e) { __showErr((e.message || 'error') + ' @ ' + (e.filename || '').split('/').slice(-1)[0] + ':' + (e.lineno || '?')); });
    window.addEventListener('unhandledrejection', function (e) { __showErr('promise: ' + (e.reason && e.reason.message || e.reason)); });
  </script>
</head>
<body>
  <!-- Offline / API-unreachable banner -->
  <div id="offline-banner" role="status"><span data-icon="blade/warn" data-cls="ic-sm"></span><span id="offline-text">API offline — một số dữ liệu không khả dụng</span>
    <button type="button" id="offline-retry" style="margin-left:10px;padding:3px 12px;font-size:11.5px;font-weight:700;border:1px solid currentColor;border-radius:99px;background:transparent;color:inherit;cursor:pointer">Thử lại</button></div>
  <script>
    (function () {
      var t0 = Date.now();
      /* Deadline không dùng AbortSignal.timeout: WebView cũ thiếu nó và sẽ ném
         TypeError ĐỒNG BỘ ở đây (ngoài chuỗi .catch bên dưới) → vòng thử lại chết hẳn
         và banner đứng mãi. AbortController có mặt rộng hơn nhiều. */
      function timedFetch(url, ms) {
        try {
          var ac = new AbortController();
          var t = setTimeout(function () { ac.abort(); }, ms);
          return fetch(url, { signal: ac.signal, cache: 'no-store' })
            .then(function (r) { clearTimeout(t); return r; },
                  function (e) { clearTimeout(t); throw e; });
        } catch (e) {
          try { return fetch(url, { cache: 'no-store' }); } catch (e2) { return Promise.reject(e2); }
        }
      }
      /* CHỈ thử lại khi app CHƯA boot được (module chặn / API chết).
         Trước đây hàm này reload ngay khi /api/status ok → app sống mà vẫn
         tự reload mỗi 1.2s thành vòng lặp vô hạn. */
      function retry() {
        if (window.__UPIO_MODULES || window.__UPIO_BOOTED) return; // app đã sống — không can thiệp nữa
        /* Dùng base đã lưu nếu có: bản APK phục vụ UI từ file bundle nên same-origin
           KHÔNG có /api — hỏi same-origin sẽ luôn fail và báo offline oan. */
        var base = '';
        try { base = window.__DSH_API_BASE || localStorage.getItem('upio.api') || ''; } catch (e) {}
        timedFetch(base + '/api/status', 2500)
          .then(function (r) { return r.json(); })
          .then(function (j) {
            if (j && j.ok === true && !window.__UPIO_MODULES && !window.__UPIO_BOOTED) { location.reload(); return true; }
            throw new Error('no');
          }).catch(function () {
            var b = document.getElementById('offline-text');
            if (b && Date.now() - t0 > 4000) {
              b.textContent = 'API offline (' + (base || location.host) + ') — đang thử lại mỗi 4s…';
            }
            setTimeout(retry, 4000);
          });
      }
      window.addEventListener('load', function () {
        var btn = document.getElementById('offline-retry');
        /* Chỉ reload khi module CHƯA sống. App đã sống thì app.js tự xử lý nút này
           bằng cách DÒ LẠI địa chỉ API — reload sẽ dùng lại đúng base đã chết. */
        if (btn) btn.addEventListener('click', function () {
          if (window.__UPIO_MODULES || window.__UPIO_BOOTED) return;
          location.reload();
        });
        setTimeout(retry, 2500);
      });
    })();
  </script>

  <!-- View containers (router hash-based) — phải có ĐỦ mọi key trong ROUTES của app.js -->
  <main id="views">
    <section class="view active" id="view-home" aria-label="Home"></section>
    <section class="view" id="view-hub" aria-label="Hub"></section>
    <section class="view" id="view-agents" aria-label="Agents"></section>
    <section class="view" id="view-term" aria-label="Terminal"></section>
    <section class="view" id="view-chat" aria-label="Chat"></section>
    <section class="view" id="view-settings" aria-label="Settings"></section>
  </main>

  <!-- Bottom tab bar -->
  <nav class="tab-bar" aria-label="Điều hướng chính">
    <button type="button" class="tab-btn active" data-route="home"><span class="tb-icon" data-icon="solar/home"></span><span class="tb-label">Home</span></button>
    <button type="button" class="tab-btn" data-route="hub"><span class="tb-icon" data-icon="solar/hub"></span><span class="tb-label">Hub</span></button>
    <button type="button" class="tab-btn" data-route="agents"><span class="tb-icon" data-icon="solar/agents"></span><span class="tb-label">Agents</span></button>
    <button type="button" class="tab-btn" data-route="term"><span class="tb-icon" data-icon="blade/code"></span><span class="tb-label">Term</span></button>
    <button type="button" class="tab-btn" data-route="chat"><span class="tb-icon" data-icon="solar/chat"></span><span class="tb-label">Chat</span></button>
    <button type="button" class="tab-btn" data-route="settings"><span class="tb-icon" data-icon="solar/settings"></span><span class="tb-label">Settings</span></button>
  </nav>

  <!-- Bottom sheet -->
  <div id="sheet-root" aria-hidden="true">
    <div id="sheet-backdrop"></div>
    <div id="sheet-panel" class="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Toasts -->
  <div id="toast-root" aria-live="polite"></div>

  <!-- Boot watchdog: nếu ES modules bị chặn (vd. file://) thì vẫn hiển thị shell + banner, không trắng trang -->
  <script>
    (function () {
      window.addEventListener('load', function () {
        setTimeout(function () {
          /* __UPIO_MODULES được app.js đặt ở top-level → module graph đã sống.
             Chỉ __UPIO_BOOTED thì không đủ: init() mất >1.5s (boot gate + fetch),
             nên watchdog cũ bật banner offline oan cho app đang chạy bình thường. */
          if (window.__UPIO_MODULES || window.__UPIO_BOOTED) return;
          document.documentElement.classList.add('no-modules');
          var b = document.getElementById('offline-banner');
          if (b) b.classList.add('show');
          var h = document.getElementById('view-home');
          if (h && !h.firstChild) {
            h.innerHTML =
              '<div class="container"><div class="card boot-note">' +
              '<div class="boot-mark-sm">harness<span class="wm-dot"></span></div>' +
              '<h2>Đang chạy ở chế độ tĩnh</h2>' +
              '<p>Không tải được module JS (file:// hoặc trình duyệt chặn ES modules).</p>' +
              '<p>Hãy phục vụ thư mục <code>web/</code> qua HTTP — ví dụ server chính ở cổng <code>8787</code>.</p>' +
              '<p class="dim">API offline — dữ liệu sẽ tự hiện khi kết nối được backend.</p>' +
              '</div></div>';
          }
        }, 1500);
      });
    })();
  </script>

  <script>
    /* APK local copy: API base lưu ở localStorage (do launcher đặt); khi serve từ server thì rỗng */
    try { window.__DSH_API_BASE = localStorage.getItem('upio.api') || ''; } catch (e) { window.__DSH_API_BASE = ''; }
  </script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
